# Quick TicTacToe training config — produces a playable (if not perfect)
# checkpoint in ~3-5 minutes on M4 Pro CPU. Use this to iterate on the
# play loop before committing to the full 15-45 min training.

n_blocks = 2
n_channels = 16

num_simulations = 25
c_puct = 1.5

games_per_iteration = 50
temperature_threshold = 6

training_steps_per_iteration = 200
batch_size = 64
learning_rate = 1e-3

replay_buffer_capacity = 20_000
min_buffer_size = 1_000

arena_interval = 5
arena_games = 20
arena_threshold = 0.55

eval_interval = 5
eval_games = 50

num_iterations = 10
seed = 42
device = "auto"
