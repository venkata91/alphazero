# Chess supervised pre-training config for the repaired existing corpus.
# Writes a new checkpoint so the original pretrained.pt remains available.

n_blocks = 15
n_channels = 192

num_epochs = 3
batch_size = 256
peak_lr = 5e-4
end_lr = 5e-5
warmup_steps = 500
weight_decay = 1e-4

holdout_fraction = 0.05
early_stopping_patience = 2

num_workers = 4
pin_memory = true

corpus_dir = "data/chess_corpus"
output_checkpoint = "pretrained_fixed.pt"
log_dir = "runs_pretrain_fixed"

seed = 42
device = "auto"
