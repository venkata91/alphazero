# Connect 4 training config — Sub-project 2.
# Defaults to AlphaZero paper conventions; tuned down for M4 Pro CPU/MPS.

# Network — bigger than TTT (richer position features needed for 6×7 board)
n_blocks = 6
n_channels = 64

# MCTS
num_simulations = 100
c_puct = 2.5
dirichlet_alpha = 0.5
dirichlet_weight = 0.25

# Self-play
games_per_iteration = 100
temperature_threshold = 15  # Connect 4 games are ~20-30 plies; cover the opening

# Training
training_steps_per_iteration = 1000
batch_size = 64
learning_rate = 1e-3
weight_decay = 1e-4

# Replay buffer
replay_buffer_capacity = 200_000
min_buffer_size = 20_000

# Eval (vs minimax-depth-8)
eval_interval = 5
eval_games = 200

# Schedule
num_iterations = 50
seed = 42
device = "auto"
checkpoint_dir = "checkpoints"
log_dir = "runs"
